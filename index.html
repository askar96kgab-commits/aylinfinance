<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AylinFinance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>AylinFinance</title>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">A</div><div><b>AylinFinance</b><small>Личный финансовый помощник</small></div></div>
  <div class="header-actions">
    <button class="ghost" id="importBtn" type="button">Импорт</button>
    <button class="ghost" id="exportBtn" type="button">PDF / Экспорт</button>
  </div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
</header>
<main id="view" aria-live="polite"></main>
<footer class="motto">Акча бул жөн гана каражат, бирок үнөмдөөнү унутпа</footer>
<nav aria-label="Основная навигация">
<button data-tab="home" class="active"><span>⌂</span>Главная</button>
<button data-tab="ops"><span>⇄</span>Операции</button>
<button data-tab="payments"><span>▦</span>Платежи</button>
<button data-tab="debts"><span>↔</span>Долги</button>
<button data-tab="stats"><span>◔</span>Аналитика</button>
</nav>
</div>
<dialog id="modal">
<form id="entryForm">
  <div class="modal-head"><b id="modalTitle">Новая запись</b><button type="button" class="ghost" id="closeModal">✕</button></div>
  <div id="formFields"></div>
  <div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Отмена</button><button type="submit" class="primary" id="saveBtn">Сохранить</button></div>
</form>
</dialog>
<script src="app.js"></script>
</body></html>
